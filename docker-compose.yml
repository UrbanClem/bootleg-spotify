services:
  db:
    image: mariadb:10.4
    container_name: bootleg-spotify-db
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: spotify_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/spotify_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bootleg-spotify-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:-dev_secret_change_in_prod}"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "spotify_db"
      DB_USER: "root"
      DB_PASSWORD: ""
    ports:
      - "3001:3001"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
